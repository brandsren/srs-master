
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SRS Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { 
            --sat: env(safe-area-inset-top); 
            --sab: env(safe-area-inset-bottom);
        }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        body { 
            -webkit-tap-highlight-color: transparent; 
            padding-top: calc(var(--sat) + 40px);
            padding-bottom: calc(var(--sab) + 0px);
            background-color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .modal-enter { animation: modalIn 0.3s ease-out; }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cloze-placeholder {
            background-color: #e0e7ff;
            color: transparent;
            border-radius: 4px;
            padding: 0 8px;
            margin: 0 4px;
            border-bottom: 2px solid #818cf8;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-900 font-sans">
    <div id="root" class="max-w-md mx-auto p-4"></div>

    <script>
        // --- Estado Global ---
        let decks = JSON.parse(localStorage.getItem('srs_v21_decks') || '[]');
        let config = JSON.parse(localStorage.getItem('srs_config_v21') || '{"autoFront": true, "autoBack": true, "shuffle": false, "prioritizeNew": false}');
        
        let view = 'home'; 
        let currentDeckId = null;
        let studyQueue = []; 
        let isFlipped = false;
        let showHint = false;
        
        let showAddDeckModal = false;
        let showRenameDeckModal = false;
        let showAddCardModal = false;
        let showEditCardModal = false;
        let showManageCardsModal = false;
        let showPreviewCardModal = false;
        let showExportModal = false;
        let showStudyConfigModal = false;
        
        let editingCardId = null;
        let isEditingFromStudy = false;
        let previewingCardId = null;
        let renamingDeckId = null;
        let addMode = 'single'; 
        let cardSubtype = 'cloze'; 
        let searchTerm = '';

        const saveDecks = () => localStorage.setItem('srs_v21_decks', JSON.stringify(decks));
        const saveConfig = () => localStorage.setItem('srs_config_v21', JSON.stringify(config));
        
        const formatDate = (dateStr) => {
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = date - now;
            const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
            if (diffDays <= 0) return "Hoje";
            if (diffDays === 1) return "Amanhã";
            return `em ${diffDays} d (${date.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'})})`;
        };

        // Lógica: Se o card foi visto, ele não é mais NOVO.
        const isNewCard = (card) => !card.wasViewed;

        const refreshStudyQueue = () => {
            const deck = decks.find(d => String(d.id) === String(currentDeckId));
            if (!deck || !deck.cards) {
                studyQueue = [];
                return;
            }
            
            // Um card deve ser estudado se:
            // 1. É Novo (wasViewed = false)
            // 2. OU se a data de revisão venceu (dueDate <= agora)
            let allDue = deck.cards.filter(c => isNewCard(c) || new Date(c.dueDate) <= new Date());
            
            const newCards = allDue.filter(c => isNewCard(c));
            const reviewCards = allDue.filter(c => !isNewCard(c));
            
            let result = config.prioritizeNew ? [...newCards, ...reviewCards] : [...reviewCards, ...newCards];
            
            if (config.shuffle) {
                for (let i = result.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [result[i], result[j]] = [result[j], result[i]];
                }
            }
            studyQueue = result;
        };

        function speak(text, callback) {
            if (!text) { if(callback) callback(); return; }
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/\[(.*?)\]/g, '$1'); 
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; 
            utterance.onend = () => { if(callback) callback(); };
            window.speechSynthesis.speak(utterance);
        }

        function toggleConfig(key) {
            config[key] = !config[key];
            saveConfig();
            refreshStudyQueue(); 
            render();
        }

        function render() {
            const root = document.getElementById('root');
            if (view === 'home') renderHome(root);
            else renderStudy(root);
        }

        function renderHome(root) {
            root.innerHTML = `
                <header class="flex justify-between items-center mb-8 pt-4 px-2">
                    <div>
                        <h1 class="text-3xl font-black italic text-indigo-600 tracking-tight uppercase">SRS Master</h1>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sua Biblioteca</p>
                    </div>
                    <button onclick="showAddDeckModal = true; render();" class="bg-indigo-600 text-white w-12 h-12 rounded-2xl shadow-lg flex items-center justify-center text-2xl font-bold active:scale-90 transition-transform">+</button>
                </header>

                <div class="space-y-4">
                    ${decks.length === 0 ? `
                        <div class="text-center py-20 bg-white rounded-[40px] border-2 border-dashed border-slate-200 p-8">
                            <p class="text-slate-400 font-medium">Nenhum baralho encontrado.</p>
                        </div>
                    ` : decks.map(deck => {
                        const total = deck.cards.length;
                        // NOVO: Nunca viu
                        const novos = deck.cards.filter(c => isNewCard(c)).length;
                        // REVISAR: Já viu alguma vez (mesmo que seja difícil/erro) E está vencido para hoje
                        const revisar = deck.cards.filter(c => !isNewCard(c) && new Date(c.dueDate) <= new Date()).length;
                        
                        return `
                        <div onclick="openDeck(${deck.id})" class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-100 flex justify-between items-center active:scale-95 transition-all cursor-pointer">
                            <div class="flex-1 truncate pr-4">
                                <h2 class="text-xl font-bold text-slate-800 truncate mb-2">${deck.name}</h2>
                                <div class="flex gap-2">
                                    <span class="bg-indigo-50 text-indigo-600 text-[9px] font-black px-2 py-1 rounded-lg uppercase">Novos: ${novos}</span>
                                    <span class="bg-emerald-50 text-emerald-600 text-[9px] font-black px-2 py-1 rounded-lg uppercase">Revisar: ${revisar}</span>
                                    <span class="bg-slate-50 text-slate-400 text-[9px] font-black px-2 py-1 rounded-lg uppercase">Total: ${total}</span>
                                </div>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="event.stopPropagation(); startRenameDeck(${deck.id})" class="text-slate-300 hover:text-indigo-500 p-2 text-lg">✏️</button>
                                <button onclick="event.stopPropagation(); if(confirm('Excluir baralho?')) deleteDeck(${deck.id})" class="text-slate-300 hover:text-red-500 p-2 text-xl">&times;</button>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
                ${showAddDeckModal ? renderAddDeckModal() : ''}
                ${showRenameDeckModal ? renderRenameDeckModal() : ''}
            `;
        }

        function renderAddDeckModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-sm modal-enter">
                        <h2 class="text-xl font-black text-slate-800 mb-6 uppercase text-center">Novo Baralho</h2>
                        <input id="deckNameInput" placeholder="Ex: Inglês Básico" class="w-full bg-slate-50 border-0 rounded-2xl p-4 mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <div class="flex gap-2">
                            <button onclick="showAddDeckModal=false; render();" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">Voltar</button>
                            <button onclick="createNewDeck()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">Criar</button>
                        </div>
                    </div>
                </div>`;
        }

        function startRenameDeck(id) { renamingDeckId = id; showRenameDeckModal = true; render(); }

        function renderRenameDeckModal() {
            const deck = decks.find(d => String(d.id) === String(renamingDeckId));
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-sm modal-enter">
                        <h2 class="text-xl font-black text-slate-800 mb-6 uppercase text-center">Renomear</h2>
                        <input id="renameDeckInput" value="${deck.name}" class="w-full bg-slate-50 border-0 rounded-2xl p-4 mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <div class="flex gap-2">
                            <button onclick="showRenameDeckModal=false; render();" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">Voltar</button>
                            <button onclick="saveNewDeckName()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">Salvar</button>
                        </div>
                    </div>
                </div>`;
        }

        function saveNewDeckName() {
            const newName = document.getElementById('renameDeckInput').value.trim();
            if (newName) {
                const idx = decks.findIndex(d => String(d.id) === String(renamingDeckId));
                decks[idx].name = newName;
                saveDecks(); showRenameDeckModal = false; render();
            }
        }

        function renderStudyConfigModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-sm modal-enter">
                        <h2 class="text-xl font-black text-slate-800 mb-6 uppercase text-center">Configurações de Estudo</h2>
                        <div class="space-y-6">
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Prioridade de Carga</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="config.prioritizeNew=false; saveConfig(); refreshStudyQueue(); render();" class="py-3 px-2 rounded-2xl text-[10px] font-bold border ${!config.prioritizeNew ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-100 text-slate-500'}">Revisões Primeiro</button>
                                    <button onclick="config.prioritizeNew=true; saveConfig(); refreshStudyQueue(); render();" class="py-3 px-2 rounded-2xl text-[10px] font-bold border ${config.prioritizeNew ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-100 text-slate-500'}">Novos Primeiro</button>
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Ordem Interna</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="config.shuffle=false; saveConfig(); refreshStudyQueue(); render();" class="py-3 px-2 rounded-2xl text-[10px] font-bold border ${!config.shuffle ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-100 text-slate-500'}">Sequencial</button>
                                    <button onclick="config.shuffle=true; saveConfig(); refreshStudyQueue(); render();" class="py-3 px-2 rounded-2xl text-[10px] font-bold border ${config.shuffle ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-100 text-slate-500'}">Aleatória</button>
                                </div>
                            </div>
                        </div>
                        <button onclick="showStudyConfigModal=false; render();" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold mt-8">Salvar</button>
                    </div>
                </div>
            `;
        }

        function renderStudy(root) {
            const card = studyQueue[0];
            root.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <button onclick="view='home'; render();" class="text-slate-400 font-bold text-xs uppercase tracking-widest">← Início</button>
                    <div class="flex gap-2">
                        <button onclick="showStudyConfigModal=true; render();" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-xl font-bold text-xs">⚙️ Ordem</button>
                        <button onclick="showManageCardsModal=true; searchTerm=''; render();" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-xl font-bold text-xs">Lista</button>
                        <button onclick="showAddCardModal=true; render();" class="bg-indigo-600 text-white px-3 py-2 rounded-xl font-bold text-xs shadow-md">+ Novo</button>
                    </div>
                </div>

                ${studyQueue.length > 0 ? `
                    <div class="flex justify-center gap-4 mb-4">
                        <button onclick="toggleConfig('autoFront')" class="text-[9px] font-black uppercase px-3 py-1.5 rounded-full border transition-all ${config.autoFront ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-slate-200 text-slate-400'}">
                            🔊 Auto Frente
                        </button>
                        <button onclick="toggleConfig('autoBack')" class="text-[9px] font-black uppercase px-3 py-1.5 rounded-full border transition-all ${config.autoBack ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-slate-200 text-slate-400'}">
                            🔊 Auto Verso
                        </button>
                    </div>

                    <div class="relative h-[430px] w-full perspective-1000">
                        <div class="relative w-full h-full preserve-3d ${isFlipped ? 'rotate-y-180' : ''}" onclick="handleFlipToggle()">
                            <!-- FRENTE -->
                            <div class="absolute inset-0 backface-hidden bg-white border border-slate-100 rounded-[40px] shadow-sm flex flex-col items-center justify-center p-8 text-center">
                                <div class="absolute top-6 right-6 flex items-center gap-1">
                                    <button onclick="event.stopPropagation(); startEditCard('${card.id}', true)" class="text-slate-300 text-lg p-2 active:scale-90 transition-transform">✏️</button>
                                </div>
                                <span class="absolute top-8 left-1/2 -translate-x-1/2 text-[10px] font-black text-slate-300 uppercase tracking-widest">
                                    ${isNewCard(card) ? 'Card Novo' : 'Revisão'}
                                </span>
                                <div class="text-2xl font-bold text-slate-800 leading-tight">
                                    ${card.type === 'cloze' ? card.f.replace(/\[(.*?)\]/g, '<span class="cloze-placeholder">...</span>') : card.f}
                                </div>
                                ${card.type === 'cloze' && card.hint ? `<div class="mt-8">${showHint ? `<div class="text-xs font-bold text-indigo-500 bg-indigo-50 px-6 py-3 rounded-2xl italic">Dica: ${card.hint}</div>` : `<button onclick="event.stopPropagation(); showHint=true; render();" class="text-[10px] font-black uppercase tracking-tighter text-slate-400 border border-slate-200 px-4 py-2 rounded-full">💡 Dica</button>`}</div>` : ''}
                            </div>
                            
                            <!-- VERSO -->
                            <div class="absolute inset-0 backface-hidden bg-indigo-600 border border-indigo-700 rounded-[40px] shadow-xl flex flex-col items-center justify-center p-8 text-center rotate-y-180">
                                <div class="absolute top-6 right-6 flex items-center gap-1">
                                    <button onclick="event.stopPropagation(); startEditCard('${card.id}', true)" class="text-indigo-300 text-lg p-2 active:scale-90 transition-transform">✏️</button>
                                </div>
                                <div class="text-2xl font-bold text-white mb-6">
                                    ${card.type === 'cloze' ? card.f.replace(/\[(.*?)\]/g, '<span class="text-yellow-300 underline">$1</span>') : card.b}
                                </div>
                                ${card.ex ? `<div class="bg-indigo-700/40 p-5 rounded-3xl border border-indigo-500/30 text-left w-full"><p class="text-[8px] font-black text-indigo-300 uppercase mb-1">Frase Exemplo</p><p class="text-sm text-white/90 italic leading-relaxed">"${card.ex}"</p></div>` : ''}
                                <button onclick="event.stopPropagation(); triggerVersoAudio('${card.id}')" class="mt-6 text-white bg-white/20 w-12 h-12 rounded-full flex items-center justify-center active:scale-90 transition-transform">🔊</button>
                            </div>
                        </div>
                    </div>

                    ${isFlipped ? `
                        <div class="grid grid-cols-4 gap-2 mt-6">
                            <button onclick="rate(1)" class="bg-rose-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase">Errei</button>
                            <button onclick="rate(2)" class="bg-amber-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase">Difícil</button>
                            <button onclick="rate(3)" class="bg-emerald-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase">Bom</button>
                            <button onclick="rate(4)" class="bg-sky-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase">Fácil</button>
                        </div>
                    ` : `<p class="text-center mt-8 text-slate-300 font-bold text-[10px] uppercase tracking-widest animate-pulse">Toque para responder</p>`}
                ` : `
                    <div class="text-center py-20 bg-white rounded-[40px] p-8 shadow-sm">
                        <div class="text-5xl mb-4 text-indigo-500">🏆</div>
                        <h2 class="text-2xl font-black text-indigo-900 uppercase">Tudo em dia!</h2>
                        <button onclick="view='home'; render();" class="mt-8 bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold">Voltar</button>
                    </div>
                `}

                ${showAddCardModal ? renderAddCardModal() : ''}
                ${showManageCardsModal ? renderManageCardsModal() : ''}
                ${showEditCardModal ? renderEditCardModal() : ''}
                ${showPreviewCardModal ? renderPreviewCardModal() : ''}
                ${showExportModal ? renderExportModal() : ''}
                ${showStudyConfigModal ? renderStudyConfigModal() : ''}
            `;
        }

        function handleFlipToggle() {
            if (studyQueue.length === 0) return;
            isFlipped = !isFlipped;
            render();
            if (isFlipped && config.autoBack) {
                triggerVersoAudio(studyQueue[0].id);
            }
        }

        function openDeck(id) {
            currentDeckId = id; 
            view = 'study'; 
            isFlipped = false; 
            showHint = false; 
            refreshStudyQueue(); 
            render();
            if (config.autoFront && studyQueue.length > 0) speak(studyQueue[0].f);
        }

        function triggerVersoAudio(cardId) {
            const card = studyQueue[0];
            if (!card || String(card.id) !== String(cardId)) return;
            const mainText = card.type === 'cloze' ? card.f : card.b;
            speak(mainText, () => { if (card.ex) setTimeout(() => speak(card.ex), 1000); });
        }

        function rate(q) {
            if (studyQueue.length === 0) return;
            const currentCard = studyQueue[0];
            const dIdx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            const cIdx = decks[dIdx].cards.findIndex(c => String(c.id) === String(currentCard.id));
            let { interval, repetition, efactor } = decks[dIdx].cards[cIdx];
            
            // Marca o card como visualizado
            decks[dIdx].cards[cIdx].wasViewed = true;

            if (q >= 3) {
                // ACERTO (Bom ou Fácil)
                if (repetition === 0) interval = 1; 
                else if (repetition === 1) interval = 6;
                else interval = Math.round(interval * efactor);
                repetition++;
            } else {
                // ERRO OU DIFÍCIL
                repetition = 0; 
                interval = (q === 2) ? 1 : 0; // Se difícil, 1 dia. Se Errei, 0 dias.
            }

            efactor = Math.max(1.3, efactor + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
            const newDate = new Date(); 
            newDate.setDate(newDate.getDate() + interval);
            
            decks[dIdx].cards[cIdx].interval = interval;
            decks[dIdx].cards[cIdx].repetition = repetition;
            decks[dIdx].cards[cIdx].efactor = efactor;
            decks[dIdx].cards[cIdx].dueDate = newDate.toISOString();
            
            saveDecks(); 
            isFlipped = false; 
            showHint = false; 
            studyQueue.shift();
            render();
            
            if (studyQueue.length > 0 && config.autoFront) {
                setTimeout(() => speak(studyQueue[0].f), 450);
            }
        }

        function createNewDeck() {
            const name = document.getElementById('deckNameInput').value.trim();
            if (name) { decks.push({ id: Date.now(), name, cards: [] }); saveDecks(); showAddDeckModal = false; render(); }
        }

        function deleteDeck(id) { if(confirm('Excluir este baralho permanentemente?')){ decks = decks.filter(d => String(d.id) !== String(id)); saveDecks(); render(); } }

        function renderManageCardsModal() {
            const deck = decks.find(d => String(d.id) === String(currentDeckId));
            const filteredCards = deck.cards.filter(c => 
                c.f.toLowerCase().includes(searchTerm.toLowerCase()) || 
                (c.b && c.b.toLowerCase().includes(searchTerm.toLowerCase()))
            );
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-lg h-[90vh] flex flex-col modal-enter overflow-hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-black text-slate-800 uppercase">Cartões e Agenda</h2>
                            <button onclick="showManageCardsModal=false; render();" class="text-slate-300 text-3xl">&times;</button>
                        </div>
                        <div class="flex gap-2 mb-4">
                            <div class="relative flex-1">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs">🔍</span>
                                <input id="searchInput" oninput="searchTerm=this.value; render();" value="${searchTerm}" placeholder="Filtrar cards..." class="w-full bg-slate-50 border-0 rounded-2xl py-3 pl-10 pr-4 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <button onclick="showExportModal=true; render();" class="bg-slate-100 text-slate-600 px-4 rounded-2xl font-bold text-[10px]">Exportar</button>
                        </div>
                        <div id="cardsListContainer" class="overflow-y-auto flex-1 space-y-3 custom-scroll pr-1">
                            ${renderCardsList(filteredCards)}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCardsList(cards) {
            if (cards.length === 0) return `<p class="text-center py-10 text-slate-400 text-sm">Nenhum card.</p>`;
            return cards.map(c => {
                const typeLabel = c.type === 'basic' ? 'C1' : (c.type === 'complete' ? 'C2' : 'L');
                const isNew = isNewCard(c);
                return `
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between items-center group">
                    <div class="truncate pr-4 flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[7px] font-black uppercase px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">${typeLabel}</span>
                            <span class="text-[7px] font-black uppercase px-2 py-0.5 rounded-full ${isNew ? 'bg-indigo-100 text-indigo-600' : 'bg-emerald-100 text-emerald-600'}">
                                ${isNew ? 'Novo' : 'Revisão'}
                            </span>
                            <span class="text-[7px] font-bold text-slate-400 uppercase tracking-tighter">${formatDate(c.dueDate)}</span>
                        </div>
                        <div class="font-bold text-slate-800 truncate text-sm">${c.f}</div>
                    </div>
                    <div class="flex gap-3 flex-shrink-0 items-center">
                        <button onclick="startPreviewCard('${c.id}')" class="text-slate-400 text-sm p-1">👁️</button>
                        <button onclick="startEditCard('${c.id}', false)" class="text-slate-400 text-sm p-1">✏️</button>
                        <button onclick="deleteCard('${c.id}')" class="text-slate-300 text-lg font-bold p-1">&times;</button>
                    </div>
                </div>
            `}).join('');
        }

        function startEditCard(id, fromStudy = false) { 
            editingCardId = id; 
            isEditingFromStudy = fromStudy;
            showEditCardModal = true; 
            showManageCardsModal = false; 
            render(); 
        }

        function renderEditCardModal() {
            const dIdx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            if (dIdx === -1) return '';
            const card = decks[dIdx].cards.find(c => String(c.id) === String(editingCardId));
            if (!card) return '';

            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-end sm:items-center justify-center p-0 sm:p-6">
                    <div class="bg-white rounded-t-[40px] sm:rounded-[40px] p-8 w-full max-w-sm overflow-y-auto max-h-[95vh] modal-enter relative">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-black text-slate-800 uppercase">Editar Card</h2>
                            <div class="flex items-center gap-2">
                                <button onclick="deleteCard('${card.id}', true)" class="text-rose-500 p-2 active:scale-90 transition-transform" title="Excluir">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                                <button onclick="showEditCardModal=false; if(!isEditingFromStudy) showManageCardsModal=true; render();" class="text-slate-300 text-3xl">&times;</button>
                            </div>
                        </div>
                        
                        <div class="space-y-4">
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Frente / Frase</p>
                                <textarea id="editF" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-24 focus:ring-2 focus:ring-indigo-500 outline-none">${card.f}</textarea>
                            </div>
                            
                            ${card.type !== 'cloze' ? `
                                <div>
                                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Verso (Tradução)</p>
                                    <textarea id="editB" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-20 focus:ring-2 focus:ring-indigo-500 outline-none">${card.b || ''}</textarea>
                                </div>
                            ` : ''}

                            ${card.type === 'complete' ? `
                                <div>
                                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Frase Exemplo</p>
                                    <textarea id="editEx" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-20 focus:ring-2 focus:ring-indigo-500 outline-none">${card.ex || ''}</textarea>
                                </div>
                            ` : ''}

                            ${card.type === 'cloze' ? `
                                <div>
                                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Dica (Significado)</p>
                                    <input id="editHint" value="${card.hint || ''}" class="w-full bg-slate-50 border-0 rounded-2xl p-4 focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                            ` : ''}

                            <div class="grid grid-cols-2 gap-2 mt-6">
                                <button onclick="showEditCardModal=false; if(!isEditingFromStudy) showManageCardsModal=true; render();" class="bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">Cancelar</button>
                                <button onclick="saveEditedCard()" class="bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-md">Salvar</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveEditedCard() {
            const dIdx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            const cIdx = decks[dIdx].cards.findIndex(c => String(c.id) === String(editingCardId));
            if(cIdx === -1) return;
            
            decks[dIdx].cards[cIdx].f = document.getElementById('editF').value.trim();
            if (decks[dIdx].cards[cIdx].type !== 'cloze') decks[dIdx].cards[cIdx].b = document.getElementById('editB').value.trim();
            if (decks[dIdx].cards[cIdx].type === 'complete') decks[dIdx].cards[cIdx].ex = document.getElementById('editEx').value.trim();
            if (decks[dIdx].cards[cIdx].type === 'cloze') decks[dIdx].cards[cIdx].hint = document.getElementById('editHint').value.trim();
            
            saveDecks(); 
            showEditCardModal = false; 
            if (isEditingFromStudy) {
                refreshStudyQueue(); 
                render();
            } else { 
                showManageCardsModal = true; 
                render(); 
            }
        }

        function deleteCard(id, fromEditor = false) {
            if(!confirm('Excluir este card permanentemente?')) return;
            const dIdx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            decks[dIdx].cards = decks[dIdx].cards.filter(c => String(c.id) !== String(id));
            saveDecks(); 
            
            if (fromEditor) {
                showEditCardModal = false;
                if (isEditingFromStudy) {
                    refreshStudyQueue();
                } else {
                    showManageCardsModal = true;
                }
            } else if (view === 'study') {
                refreshStudyQueue();
            }
            render();
        }

        function startPreviewCard(id) {
            previewingCardId = id;
            showPreviewCardModal = true;
            showManageCardsModal = false;
            render();
        }

        function renderPreviewCardModal() {
            const dIdx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            const card = decks[dIdx].cards.find(c => String(c.id) === String(previewingCardId));
            if(!card) return '';
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-sm modal-enter">
                        <h2 class="text-xl font-black text-slate-800 mb-6 uppercase text-center">Visualizar</h2>
                        <div class="space-y-4 mb-8">
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <p class="text-[8px] font-black text-slate-400 uppercase mb-1">Frente</p>
                                <p class="text-sm font-bold text-slate-700">${card.f}</p>
                            </div>
                            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
                                <p class="text-[8px] font-black text-indigo-400 uppercase mb-1">Verso / Significado</p>
                                <p class="text-sm font-bold text-indigo-700">${card.type === 'cloze' ? card.hint : card.b}</p>
                            </div>
                        </div>
                        <button onclick="showPreviewCardModal=false; showManageCardsModal=true; render();" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Fechar</button>
                    </div>
                </div>
            `;
        }

        function saveBulkCards() {
            const data = document.getElementById('bulkData').value.trim();
            if(!data) return;
            const lines = data.split('\n').filter(l => l.includes(';'));
            const idx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            lines.forEach((line, i) => {
                const parts = line.split(';').map(s => s.trim());
                if (parts[0]) {
                    let f = parts[0], b = parts[1] || '', ex = parts[2] || '', hint = parts[3] || '';
                    let type = 'basic';
                    if (f.includes('[') && f.includes(']')) {
                        type = 'cloze';
                        if (b && !hint) hint = b;
                        b = '';
                    } else if (ex) {
                        type = 'complete';
                    }
                    decks[idx].cards.push({ 
                        id: Date.now() + i + Math.random(), 
                        type, f, b, ex, hint, 
                        interval: 0, repetition: 0, efactor: 2.5, 
                        dueDate: new Date().toISOString(),
                        wasViewed: false
                    });
                }
            });
            saveDecks(); 
            showAddCardModal = false; 
            refreshStudyQueue();
            render();
        }

        function saveSingleCard() {
            const f = document.getElementById('newF').value.trim();
            if (!f) return;
            const cardData = {
                id: Date.now(), type: cardSubtype, f, 
                b: cardSubtype === 'cloze' ? '' : document.getElementById('newB').value.trim(),
                ex: cardSubtype === 'complete' ? document.getElementById('newEx').value.trim() : '',
                hint: cardSubtype === 'cloze' ? document.getElementById('newHint').value.trim() : '',
                interval: 0, repetition: 0, efactor: 2.5, dueDate: new Date().toISOString(),
                wasViewed: false
            };
            const idx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            decks[idx].cards.push(cardData);
            saveDecks(); 
            showAddCardModal = false; 
            refreshStudyQueue();
            render();
        }

        function renderExportModal() {
            const deck = decks.find(d => String(d.id) === String(currentDeckId));
            const exportText = deck.cards.map(c => {
                if (c.type === 'cloze') {
                    const hintValue = c.hint ? c.hint.trim() : "";
                    return `${c.f.trim()};${hintValue}`;
                }
                let parts = [c.f.trim()];
                if (c.b) parts.push(c.b.trim());
                if (c.ex) parts.push(c.ex.trim());
                if (c.hint && c.type !== 'cloze') parts.push(c.hint.trim());
                return parts.join(';');
            }).join('\n');

            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-sm modal-enter shadow-2xl">
                        <h2 class="text-xl font-black text-slate-800 mb-2 uppercase">Exportar Dados</h2>
                        <p class="text-[10px] text-slate-400 font-bold mb-4 uppercase">Copia e cola no seu arquivo de backup</p>
                        <textarea readonly onclick="this.select()" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-56 font-mono text-[10px] mb-4 outline-none focus:ring-2 focus:ring-indigo-500">${exportText}</textarea>
                        <button onclick="showExportModal=false; render();" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold active:scale-95 transition-transform">Fechar</button>
                    </div>
                </div>
            `;
        }

        function renderAddCardModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-6">
                    <div class="bg-white rounded-t-[40px] sm:rounded-[40px] p-8 w-full max-w-sm overflow-y-auto max-h-[95vh] modal-enter">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-black text-slate-800 uppercase">Novo Card</h2>
                            <button onclick="showAddCardModal=false; render();" class="text-slate-300 text-3xl">&times;</button>
                        </div>
                        <div class="flex bg-slate-100 p-1 rounded-2xl mb-6 text-[10px] font-black uppercase">
                            <button onclick="addMode='single'; render();" class="flex-1 py-3 rounded-xl transition-all ${addMode==='single'?'bg-white shadow-sm text-indigo-600':'text-slate-400'}">Individual</button>
                            <button onclick="addMode='bulk'; render();" class="flex-1 py-3 rounded-xl transition-all ${addMode==='bulk'?'bg-white shadow-sm text-indigo-600':'text-slate-400'}">Importar (;)</button>
                        </div>
                        ${addMode === 'single' ? `
                            <div class="grid grid-cols-3 gap-1 mb-6">
                                <button onclick="cardSubtype='basic'; render();" class="text-[8px] font-black uppercase py-2 border rounded-lg ${cardSubtype==='basic'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-100 text-slate-400'}">Card 1</button>
                                <button onclick="cardSubtype='complete'; render();" class="text-[8px] font-black uppercase py-2 border rounded-lg ${cardSubtype==='complete'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-100 text-slate-400'}">Card 2</button>
                                <button onclick="cardSubtype='cloze' ; render();" class="text-[8px] font-black uppercase py-2 border rounded-lg ${cardSubtype==='cloze'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-100 text-slate-400'}">Lacuna</button>
                            </div>
                            <div class="space-y-4">
                                <textarea id="newF" placeholder="${cardSubtype === 'cloze' ? 'Frase com [termo]' : 'Frente do Card'}" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-24 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                                ${cardSubtype !== 'cloze' ? `<textarea id="newB" placeholder="Verso (Tradução)" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-20 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>` : ''}
                                ${cardSubtype === 'complete' ? `<textarea id="newEx" placeholder="Frase de Exemplo" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-20 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>` : ''}
                                ${cardSubtype === 'cloze' ? `<input id="newHint" placeholder="Dica (Significado)" class="w-full bg-slate-50 border-0 rounded-2xl p-4 focus:ring-2 focus:ring-indigo-500 outline-none">` : ''}
                                <button onclick="saveSingleCard()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-md">Adicionar</button>
                            </div>
                        ` : `
                            <textarea id="bulkData" placeholder="Ex: I drink [coffee];café" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-56 focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-[10px]"></textarea>
                            <button onclick="saveBulkCards()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-4">Importar</button>
                        `}
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
