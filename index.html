
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SRS Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sat: env(safe-area-inset-top); }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        body { 
            -webkit-tap-highlight-color: transparent; 
            padding-top: calc(var(--sat) + 20px);
            background-color: #f8fafc;
        }

        .modal-enter { animation: modalIn 0.3s ease-out; }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cloze-placeholder {
            background-color: #e0e7ff;
            color: transparent;
            border-radius: 4px;
            padding: 0 8px;
            margin: 0 4px;
            border-bottom: 2px solid #818cf8;
            cursor: pointer;
        }
    </style>
</head>
<body class="text-slate-900 font-sans">
    <div id="root" class="max-w-md mx-auto p-4 min-h-screen"></div>

    <script>
        // --- State Management ---
        let decks = JSON.parse(localStorage.getItem('srs_v8_decks') || '[]');
        let config = JSON.parse(localStorage.getItem('srs_config_v8') || '{"autoFront": true, "autoBack": true}');
        
        let view = 'home'; 
        let currentDeckId = null;
        let isFlipped = false;
        let showHint = false;
        
        let showAddDeckModal = false;
        let showAddCardModal = false;
        let showEditCardModal = false;
        let showManageCardsModal = false;
        
        let editingCardId = null;
        let addMode = 'single'; 
        let cardSubtype = 'basic'; 

        const saveDecks = () => localStorage.setItem('srs_v8_decks', JSON.stringify(decks));
        const saveConfig = () => localStorage.setItem('srs_config_v8', JSON.stringify(config));
        const getDueCards = (deck) => (deck && deck.cards ? deck.cards.filter(c => new Date(c.dueDate) <= new Date()) : []);

        function speak(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/\[(.*?)\]/g, '$1'); 
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        function toggleConfig(key) {
            config[key] = !config[key];
            saveConfig();
            render();
        }

        function render() {
            const root = document.getElementById('root');
            if (view === 'home') renderHome(root);
            else renderStudy(root);
        }

        function renderHome(root) {
            root.innerHTML = `
                <header class="flex justify-between items-center mb-8 pt-4 px-2">
                    <div>
                        <h1 class="text-3xl font-black italic text-indigo-600 tracking-tight uppercase">SRS Master</h1>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sua Biblioteca</p>
                    </div>
                    <button onclick="showAddDeckModal = true; render();" class="bg-indigo-600 text-white w-12 h-12 rounded-2xl shadow-lg flex items-center justify-center text-2xl font-bold active:scale-90 transition-transform">+</button>
                </header>

                <div class="space-y-4">
                    ${decks.length === 0 ? `
                        <div class="text-center py-20 bg-white rounded-[40px] border-2 border-dashed border-slate-200 p-8">
                            <p class="text-slate-400 font-medium">Nenhum baralho encontrado.</p>
                            <button onclick="showAddDeckModal = true; render();" class="mt-4 text-indigo-600 font-bold text-sm underline">Criar agora</button>
                        </div>
                    ` : decks.map(deck => {
                        const dueCount = getDueCards(deck).length;
                        return `
                        <div onclick="openDeck(${deck.id})" class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-100 flex justify-between items-center active:scale-95 transition-all cursor-pointer">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">${deck.name}</h2>
                                <p class="text-sm ${dueCount > 0 ? 'text-indigo-500 font-bold' : 'text-slate-400'}">${dueCount} revisões</p>
                            </div>
                            <button onclick="event.stopPropagation(); if(confirm('Excluir baralho?')) deleteDeck(${deck.id})" class="text-slate-300 hover:text-red-500 p-2 text-xl">&times;</button>
                        </div>
                        `;
                    }).join('')}
                </div>
                ${showAddDeckModal ? renderAddDeckModal() : ''}
            `;
        }

        function renderAddDeckModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-sm modal-enter">
                        <h2 class="text-xl font-black text-slate-800 mb-6 uppercase text-center">Novo Baralho</h2>
                        <input id="deckNameInput" placeholder="Ex: Inglês Básico" class="w-full bg-slate-50 border-0 rounded-2xl p-4 mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <div class="flex gap-2">
                            <button onclick="showAddDeckModal=false; render();" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">Voltar</button>
                            <button onclick="createNewDeck()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">Criar</button>
                        </div>
                    </div>
                </div>`;
        }

        function renderStudy(root) {
            const deck = decks.find(d => d.id === currentDeckId);
            const dueCards = getDueCards(deck);
            const card = dueCards[0];

            root.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <button onclick="view='home'; render();" class="text-slate-400 font-bold text-xs uppercase tracking-widest">← Início</button>
                    <div class="flex gap-2">
                        <button onclick="showManageCardsModal=true; render();" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl font-bold text-xs">Lista</button>
                        <button onclick="showAddCardModal=true; render();" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-md">+ Novo</button>
                    </div>
                </div>

                ${dueCards.length > 0 ? `
                    <div class="flex justify-center gap-4 mb-4">
                        <button onclick="toggleConfig('autoFront')" class="text-[9px] font-black uppercase px-3 py-1.5 rounded-full border transition-all ${config.autoFront ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-slate-200 text-slate-400'}">
                            🔊 Auto Frente: ${config.autoFront ? 'ON' : 'OFF'}
                        </button>
                        <button onclick="toggleConfig('autoBack')" class="text-[9px] font-black uppercase px-3 py-1.5 rounded-full border transition-all ${config.autoBack ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-slate-200 text-slate-400'}">
                            🔊 Auto Verso: ${config.autoBack ? 'ON' : 'OFF'}
                        </button>
                    </div>

                    <div class="relative h-[430px] w-full perspective-1000">
                        <div class="relative w-full h-full preserve-3d ${isFlipped ? 'rotate-y-180' : ''}" onclick="handleFlip()">
                            <!-- Frente -->
                            <div class="absolute inset-0 backface-hidden bg-white border border-slate-100 rounded-[40px] shadow-sm flex flex-col items-center justify-center p-8 text-center">
                                <button onclick="event.stopPropagation(); startEditCard('${card.id}')" class="absolute top-6 right-8 text-slate-300 active:text-indigo-500 p-2">✏️</button>
                                <span class="absolute top-8 left-1/2 -translate-x-1/2 text-[10px] font-black text-slate-300 uppercase tracking-widest">
                                    ${card.type === 'cloze' ? 'Card 3: Lacuna' : (card.type === 'complete' ? 'Card 2: Completo' : 'Card 1: Básico')}
                                </span>
                                <div class="text-2xl font-bold text-slate-800 leading-tight">
                                    ${card.type === 'cloze' ? card.f.replace(/\[(.*?)\]/g, '<span class="cloze-placeholder">...</span>') : card.f}
                                </div>
                                ${card.type === 'cloze' && card.hint ? `
                                    <div class="mt-8">
                                        ${showHint ? `<div class="text-xs font-bold text-indigo-500 bg-indigo-50 px-6 py-3 rounded-2xl italic">Dica: ${card.hint}</div>` : `<button onclick="event.stopPropagation(); showHint=true; render();" class="text-[10px] font-black uppercase tracking-tighter text-slate-400 border border-slate-200 px-4 py-2 rounded-full active:bg-slate-100">💡 Ver Dica</button>`}
                                    </div>
                                ` : ''}
                            </div>
                            
                            <!-- Verso -->
                            <div class="absolute inset-0 backface-hidden bg-indigo-600 border border-indigo-700 rounded-[40px] shadow-xl flex flex-col items-center justify-center p-8 text-center rotate-y-180">
                                <button onclick="event.stopPropagation(); startEditCard('${card.id}')" class="absolute top-6 right-8 text-white/40 active:text-white p-2">✏️</button>
                                <div class="text-2xl font-bold text-white mb-6">
                                    ${card.type === 'cloze' ? card.f.replace(/\[(.*?)\]/g, '<span class="text-yellow-300 underline">$1</span>') : card.b}
                                </div>
                                ${card.ex ? `<div class="bg-indigo-700/40 p-5 rounded-3xl border border-indigo-500/30 text-left w-full"><p class="text-[8px] font-black text-indigo-300 uppercase mb-1">Frase Exemplo</p><p class="text-sm text-white/90 italic leading-relaxed">"${card.ex}"</p></div>` : ''}
                                <button onclick="event.stopPropagation(); triggerVersoAudio('${card.id}')" class="mt-6 text-white bg-white/20 w-12 h-12 rounded-full flex items-center justify-center active:scale-90 transition-transform">🔊</button>
                            </div>
                        </div>
                    </div>

                    ${isFlipped ? `
                        <div class="grid grid-cols-4 gap-2 mt-6">
                            <button onclick="rate(1)" class="bg-rose-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase">Errei</button>
                            <button onclick="rate(2)" class="bg-amber-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase">Difícil</button>
                            <button onclick="rate(3)" class="bg-emerald-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase">Bom</button>
                            <button onclick="rate(4)" class="bg-sky-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase">Fácil</button>
                        </div>
                    ` : `<p class="text-center mt-8 text-slate-300 font-bold text-[10px] uppercase tracking-widest animate-pulse">Toque para responder</p>`}
                ` : `
                    <div class="text-center py-20 bg-white rounded-[40px] p-8 shadow-sm">
                        <div class="text-5xl mb-4 text-indigo-500">🏆</div>
                        <h2 class="text-2xl font-black text-indigo-900 uppercase">Tudo em dia!</h2>
                        <button onclick="view='home'; render();" class="mt-8 bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold">Voltar</button>
                    </div>
                `}

                ${showAddCardModal ? renderAddCardModal() : ''}
                ${showManageCardsModal ? renderManageCardsModal() : ''}
                ${showEditCardModal ? renderEditCardModal() : ''}
            `;
        }

        function createNewDeck() {
            const name = document.getElementById('deckNameInput').value.trim();
            if (name) { decks.push({ id: Date.now(), name, cards: [] }); saveDecks(); showAddDeckModal = false; render(); }
        }

        function deleteDeck(id) { decks = decks.filter(d => d.id !== id); saveDecks(); render(); }

        function openDeck(id) {
            currentDeckId = id; view = 'study'; isFlipped = false; showHint = false; render();
            const deck = decks.find(d => d.id === currentDeckId);
            const due = getDueCards(deck);
            if (config.autoFront && due.length > 0) speak(due[0].f);
        }

        function saveSingleCard() {
            const f = document.getElementById('newF').value.trim();
            if (!f) return;
            const cardData = {
                id: Date.now(), type: cardSubtype, f, 
                b: cardSubtype === 'cloze' ? '' : document.getElementById('newB').value.trim(),
                ex: cardSubtype === 'complete' ? document.getElementById('newEx').value.trim() : '',
                hint: cardSubtype === 'cloze' ? document.getElementById('newHint').value.trim() : '',
                interval: 0, repetition: 0, efactor: 2.5, dueDate: new Date().toISOString()
            };
            const idx = decks.findIndex(d => d.id === currentDeckId);
            decks[idx].cards.push(cardData);
            saveDecks(); showAddCardModal = false; render();
        }

        function saveBulkCards() {
            const data = document.getElementById('bulkData').value.trim();
            const lines = data.split('\n').filter(l => l.includes(';'));
            const idx = decks.findIndex(d => d.id === currentDeckId);
            lines.forEach((line, i) => {
                const p = line.split(';').map(s => s.trim());
                if (p[0]) {
                    let type = 'basic';
                    let f = p[0];
                    let b = p[1] || '';
                    let ex = p[2] || '';
                    let hint = p[3] || '';

                    // Lógica específica para Lacuna (Cloze) na importação em massa
                    if (f.includes('[') && f.includes(']')) {
                        type = 'cloze';
                        // Se for lacuna, o segundo campo fornecido (p[1]) já é a dica
                        hint = b; 
                        b = ''; // Limpa verso pois lacuna usa a própria frente formatada
                    } else if (ex) {
                        type = 'complete';
                    }

                    decks[idx].cards.push({
                        id: Date.now() + i, type, f, b, ex, hint,
                        interval: 0, repetition: 0, efactor: 2.5, dueDate: new Date().toISOString()
                    });
                }
            });
            saveDecks(); showAddCardModal = false; render();
        }

        function handleFlip() {
            if (isFlipped) return;
            isFlipped = true; render();
            if (config.autoBack) {
                const deck = decks.find(d => d.id === currentDeckId);
                const due = getDueCards(deck);
                if(due[0]) triggerVersoAudio(due[0].id);
            }
        }

        function triggerVersoAudio(cardId) {
            const deck = decks.find(d => d.id === currentDeckId);
            const card = deck.cards.find(c => String(c.id) === String(cardId));
            if (!card) return;
            let textToSpeak = card.type === 'cloze' ? card.f : card.b;
            if (card.ex) textToSpeak += ". " + card.ex;
            speak(textToSpeak);
        }

        function startEditCard(id) { 
            editingCardId = id; 
            showEditCardModal = true; 
            showManageCardsModal = false; 
            render(); 
        }

        function saveEditedCard() {
            const dIdx = decks.findIndex(d => d.id === currentDeckId);
            const cIdx = decks[dIdx].cards.findIndex(c => String(c.id) === String(editingCardId));
            if(cIdx === -1) return;
            decks[dIdx].cards[cIdx].f = document.getElementById('editF').value.trim();
            if (decks[dIdx].cards[cIdx].type !== 'cloze') decks[dIdx].cards[cIdx].b = document.getElementById('editB').value.trim();
            if (decks[dIdx].cards[cIdx].type === 'complete') decks[dIdx].cards[cIdx].ex = document.getElementById('editEx').value.trim();
            if (decks[dIdx].cards[cIdx].type === 'cloze') decks[dIdx].cards[cIdx].hint = document.getElementById('editHint').value.trim();
            saveDecks(); showEditCardModal = false; render();
        }

        function deleteCard(id) {
            if(!confirm('Excluir este card?')) return;
            const dIdx = decks.findIndex(d => d.id === currentDeckId);
            decks[dIdx].cards = decks[dIdx].cards.filter(c => String(c.id) !== String(id));
            saveDecks(); render();
        }

        function rate(q) {
            const dIdx = decks.findIndex(d => d.id === currentDeckId);
            const due = getDueCards(decks[dIdx]);
            if(!due[0]) return;
            const cIdx = decks[dIdx].cards.findIndex(c => c.id === due[0].id);
            let { interval, repetition, efactor } = decks[dIdx].cards[cIdx];
            if (q >= 3) {
                if (repetition === 0) interval = 1; else if (repetition === 1) interval = 6;
                else interval = Math.round(interval * efactor);
                repetition++;
            } else { repetition = 0; interval = 1; }
            efactor = Math.max(1.3, efactor + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
            const newDate = new Date(); newDate.setDate(newDate.getDate() + interval);
            decks[dIdx].cards[cIdx] = { ...decks[dIdx].cards[cIdx], interval, repetition, efactor, dueDate: newDate.toISOString() };
            saveDecks(); isFlipped = false; showHint = false; render();
            const nextDue = getDueCards(decks[dIdx]);
            if (config.autoFront && nextDue.length > 0) setTimeout(() => speak(nextDue[0].f), 450);
        }

        function renderAddCardModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-6">
                    <div class="bg-white rounded-t-[40px] sm:rounded-[40px] p-8 w-full max-w-sm overflow-y-auto max-h-[95vh] modal-enter">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-black text-slate-800 uppercase">Adicionar Cards</h2>
                            <button onclick="showAddCardModal=false; render();" class="text-slate-300 text-3xl">&times;</button>
                        </div>
                        <div class="flex bg-slate-100 p-1 rounded-2xl mb-6 text-[10px] font-black uppercase">
                            <button onclick="addMode='single'; render();" class="flex-1 py-3 rounded-xl transition-all ${addMode==='single'?'bg-white shadow-sm text-indigo-600':'text-slate-400'}">Individual</button>
                            <button onclick="addMode='bulk'; render();" class="flex-1 py-3 rounded-xl transition-all ${addMode==='bulk'?'bg-white shadow-sm text-indigo-600':'text-slate-400'}">Em massa</button>
                        </div>
                        ${addMode === 'single' ? `
                            <div class="grid grid-cols-3 gap-1 mb-6">
                                <button onclick="cardSubtype='basic'; render();" class="text-[8px] font-black uppercase py-2 border rounded-lg ${cardSubtype==='basic'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-100 text-slate-400'}">1. Básico</button>
                                <button onclick="cardSubtype='complete'; render();" class="text-[8px] font-black uppercase py-2 border rounded-lg ${cardSubtype==='complete'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-100 text-slate-400'}">2. Completo</button>
                                <button onclick="cardSubtype='cloze' ; render();" class="text-[8px] font-black uppercase py-2 border rounded-lg ${cardSubtype==='cloze'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-100 text-slate-400'}">3. Lacuna</button>
                            </div>
                            <div class="space-y-4">
                                <textarea id="newF" placeholder="${cardSubtype === 'cloze' ? 'Frase com [lacuna]' : 'Frente (Palavra)'}" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-24 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                                ${cardSubtype !== 'cloze' ? `<textarea id="newB" placeholder="Verso (Tradução)" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-20 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>` : ''}
                                ${cardSubtype === 'complete' ? `<textarea id="newEx" placeholder="Frase de Exemplo" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-20 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>` : ''}
                                ${cardSubtype === 'cloze' ? `<input id="newHint" placeholder="Dica (Opcional)" class="w-full bg-slate-50 border-0 rounded-2xl p-4 focus:ring-2 focus:ring-indigo-500 outline-none">` : ''}
                                <button onclick="saveSingleCard()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-md">Salvar Card</button>
                            </div>
                        ` : `
                            <div class="bg-indigo-50 p-4 rounded-2xl mb-4 border border-indigo-100">
                                <h3 class="text-[10px] font-black text-indigo-600 uppercase mb-2">Orientações (Massa):</h3>
                                <ul class="text-[9px] text-indigo-900/70 space-y-1 font-medium">
                                    <li>• Use ponto e vírgula (;)</li>
                                    <li>• <b>Básico:</b> Palavra ; Tradução</li>
                                    <li>• <b>Lacuna:</b> Frase com [lacuna] ; Dica</li>
                                </ul>
                            </div>
                            <textarea id="bulkData" placeholder="Ex: I drink [coffee] ; café&#10;Ex: cat ; gato" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-56 focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-[10px]"></textarea>
                            <button onclick="saveBulkCards()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-4">Importar Todos</button>
                        `}
                    </div>
                </div>
            `;
        }

        function renderManageCardsModal() {
            const deck = decks.find(d => d.id === currentDeckId);
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-lg h-[80vh] flex flex-col modal-enter">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-black text-slate-800 uppercase">Cartões</h2>
                            <button onclick="showManageCardsModal=false; render();" class="text-slate-300 text-3xl">&times;</button>
                        </div>
                        <div class="overflow-y-auto flex-1 space-y-2">
                            ${deck.cards.map(c => `
                                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between items-center">
                                    <div class="truncate pr-4">
                                        <div class="text-[8px] font-black uppercase text-indigo-500 mb-1">Tipo ${c.type === 'cloze' ? '3' : (c.type === 'complete' ? '2' : '1')}</div>
                                        <div class="font-bold text-slate-800 truncate">${c.f}</div>
                                    </div>
                                    <div class="flex gap-2 flex-shrink-0">
                                        <button onclick="startEditCard('${c.id}')">✏️</button>
                                        <button onclick="deleteCard('${c.id}')">🗑️</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderEditCardModal() {
            const deck = decks.find(d => d.id === currentDeckId);
            const card = deck.cards.find(c => String(c.id) === String(editingCardId));
            if(!card) return '';
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-sm modal-enter">
                        <h2 class="text-xl font-black text-slate-800 mb-6 uppercase">Editar Card</h2>
                        <div class="space-y-3">
                            <textarea id="editF" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-24 outline-none focus:ring-2 focus:ring-indigo-500">${card.f}</textarea>
                            ${card.type !== 'cloze' ? `<textarea id="editB" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-20 outline-none focus:ring-2 focus:ring-indigo-500">${card.b || ''}</textarea>` : ''}
                            ${card.type === 'complete' ? `<textarea id="editEx" class="w-full bg-slate-50 border-0 rounded-2xl p-4 h-20 outline-none focus:ring-2 focus:ring-indigo-500">${card.ex || ''}</textarea>` : ''}
                            ${card.type === 'cloze' ? `<input id="editHint" value="${card.hint || ''}" class="w-full bg-slate-50 border-0 rounded-2xl p-4 focus:ring-2 focus:ring-indigo-500">` : ''}
                        </div>
                        <div class="flex gap-2 mt-6">
                            <button onclick="showEditCardModal=false; render();" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">Voltar</button>
                            <button onclick="saveEditedCard()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">Salvar</button>
                        </div>
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
