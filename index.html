

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SRS Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --sat: env(safe-area-inset-top); 
            --sab: env(safe-area-inset-bottom);
        }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        body { 
            -webkit-tap-highlight-color: transparent; 
            padding-top: calc(var(--sat) + 60px);
            padding-bottom: calc(var(--sab) + 0px);
            background-color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .modal-enter { animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .cloze-placeholder {
            background-color: #e0e7ff;
            color: transparent;
            border-radius: 6px;
            padding: 0 10px;
            margin: 0 4px;
            border-bottom: 2px solid #6366f1;
        }

        .extra-note {
            display: block;
            margin-top: 8px;
            color: #94a3b8;
            font-size: 0.7em;
            font-weight: 500;
            line-height: 1.2;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
        .urgent-alert {
            animation: pulse-red 2s infinite;
        }
    </style>
</head>
<body class="text-slate-900 font-sans">
    <div id="root" class="max-w-md mx-auto p-4"></div>

    <script>
        // --- Estado Global ---
        let decks = JSON.parse(localStorage.getItem('srs_v22_decks') || '[]');
        let config = JSON.parse(localStorage.getItem('srs_config_v22') || '{"shuffle": false, "prioritizeNew": false}');
        
        let view = 'home'; 
        let currentDeckId = null;
        let studyQueue = []; 
        let isFlipped = false;
        let showHint = false;
        
        let showAddDeckModal = false;
        let showRenameDeckModal = false;
        let showAddCardModal = false;
        let showEditCardModal = false;
        let showManageCardsModal = false;
        let showExportModal = false;
        let showStudyConfigModal = false;
        let showConfirmResetModal = false;
        let showPreviewModal = false;
        let cardAddedFeedback = false;
        
        let editingCardId = null;
        let isEditingFromStudy = false;
        let renamingDeckId = null;
        let addMode = 'single'; 
        let cardSubtype = 'cloze'; 
        let searchTerm = '';
        let showOnlyErrors = false;

        let tempDraft = { f: '', b: '', ex: '', hint: '' };
        let previewFlipped = false;
        let previewShowHint = false;
        window.tempPreviewCard = null;

        const saveDecks = () => localStorage.setItem('srs_v22_decks', JSON.stringify(decks));
        const saveConfig = () => localStorage.setItem('srs_config_v22', JSON.stringify(config));
        
        const getStartOfToday = () => {
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            return now;
        };

        const formatDate = (dateStr) => {
            const dueDate = new Date(dateStr);
            const today = getStartOfToday();
            const dateOnly = new Date(dueDate);
            dateOnly.setHours(0,0,0,0);
            const diffMs = dateOnly - today;
            const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));
            if (diffDays <= 0) return "Hoje";
            if (diffDays === 1) return "Amanhã";
            return `em ${diffDays} d`;
        };

        const isNewCard = (card) => !card.wasViewed;
        const getCurrentDeck = () => decks.find(d => String(d.id) === String(currentDeckId));

        // CORREÇÃO: Função de embaralhar corrigida (Fisher-Yates)
        const shuffleArray = (arr) => {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        const refreshStudyQueue = () => {
            const deck = getCurrentDeck();
            if (!deck || !deck.cards) {
                studyQueue = [];
                return;
            }
            const now = new Date();
            let allDue = deck.cards.filter(c => isNewCard(c) || new Date(c.dueDate) <= now);
            
            const errorCards = allDue.filter(c => !isNewCard(c) && c.interval === 0);
            const newCards = allDue.filter(c => isNewCard(c));
            const reviewCards = allDue.filter(c => !isNewCard(c) && c.interval > 0);

            // Aplica embaralhamento se configurado
            const sErrors = config.shuffle ? shuffleArray(errorCards) : errorCards;
            const sNew = config.shuffle ? shuffleArray(newCards) : newCards;
            const sReview = config.shuffle ? shuffleArray(reviewCards) : reviewCards;

            if (config.prioritizeNew) {
                studyQueue = [...sErrors, ...sNew, ...sReview];
            } else {
                studyQueue = [...sErrors, ...sReview, ...sNew];
            }
        };

        function speak(text, callback) {
            if (!text) { if(callback) callback(); return; }
            window.speechSynthesis.cancel();
            let cleanText = text.replace(/\[(.*?)\]/g, '$1'); 
            cleanText = cleanText.replace(/\{.*?\}/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText.trim());
            utterance.lang = 'en-US';
            utterance.rate = 0.85; 
            utterance.onend = () => { if(callback) callback(); };
            window.speechSynthesis.speak(utterance);
        }

        function formatCardText(text, isBack = false) {
            if (!text) return "";
            let notes = [];
            let formatted = text.replace(/\{(.*?)\}/g, (match, p1) => {
                notes.push(p1);
                return "";
            });
            if (formatted.includes('[') && formatted.includes(']')) {
                if (!isBack) {
                    formatted = formatted.replace(/\[(.*?)\]/g, '<span class="cloze-placeholder">...</span>');
                } else {
                    formatted = formatted.replace(/\[(.*?)\]/g, '<span class="bg-yellow-300 text-slate-900 px-2 rounded-lg">$1</span>');
                }
            }
            let html = `<span>${formatted}</span>`;
            if (notes.length > 0) {
                notes.forEach(note => {
                    html += `<span class="extra-note">${note}</span>`;
                });
            }
            return html;
        }

        function toggleAudioSetting(key) {
            const deck = getCurrentDeck();
            if (!deck) return;
            deck[key] = deck[key] === undefined ? false : !deck[key];
            saveDecks();
            render();
        }

        function render() {
            const root = document.getElementById('root');
            if (view === 'home') renderHome(root);
            else renderStudy(root);
            lucide.createIcons();
        }

        function renderHome(root) {
            root.innerHTML = `
                <header class="flex justify-between items-center mb-8 pt-4 px-2">
                    <div>
                        <h1 class="text-3xl font-black italic text-indigo-600 tracking-tight flex items-center gap-2">
                           SRS MASTER
                        </h1>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Personal Study Library</p>
                    </div>
                    <button onclick="showAddDeckModal = true; render();" class="bg-indigo-600 text-white w-12 h-12 rounded-2xl shadow-xl shadow-indigo-200 flex items-center justify-center active:scale-90 transition-transform">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </button>
                </header>

                <div class="space-y-4">
                    ${decks.length === 0 ? `
                        <div class="text-center py-20 bg-white rounded-[40px] border-2 border-dashed border-slate-200 p-8">
                            <i data-lucide="layers" class="w-12 h-12 text-slate-200 mx-auto mb-4"></i>
                            <p class="text-slate-400 font-medium">Nenhum deck criado.</p>
                        </div>
                    ` : decks.map(deck => {
                        const novos = deck.cards.filter(c => isNewCard(c)).length;
                        const revisar = deck.cards.filter(c => !isNewCard(c) && new Date(c.dueDate) <= new Date()).length;
                        const total = deck.cards.length;
                        return `
                        <div onclick="openDeck(${deck.id})" class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-100 flex justify-between items-center active:scale-[0.98] transition-all cursor-pointer relative overflow-hidden group">
                            <div class="flex-1 truncate pr-4">
                                <div class="flex items-center gap-2 mb-2">
                                    <h2 class="text-xl font-bold text-slate-800 truncate">${deck.name}</h2>
                                    <button onclick="event.stopPropagation(); startRenameDeck(${deck.id})" class="text-slate-300 hover:text-indigo-500 p-1 transition-colors">
                                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div class="flex flex-wrap gap-2">
                                    <span class="bg-indigo-50 text-indigo-600 text-[8px] font-black px-2 py-1 rounded-lg uppercase tracking-wider">NOVOS: ${novos}</span>
                                    <span class="bg-emerald-50 text-emerald-600 text-[8px] font-black px-2 py-1 rounded-lg uppercase tracking-wider">REVISAR: ${revisar}</span>
                                    <span class="bg-slate-100 text-slate-400 text-[8px] font-black px-2 py-1 rounded-lg uppercase tracking-wider">TOTAL: ${total}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                ${revisar > 0 ? `<div class="urgent-alert bg-rose-500 text-white w-6 h-6 rounded-full flex items-center justify-center"><i data-lucide="alert-circle" class="w-4 h-4"></i></div>` : ''}
                                <div class="text-slate-200 group-hover:text-indigo-300 transition-colors"><i data-lucide="chevron-right" class="w-6 h-6"></i></div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
                ${showAddDeckModal ? renderAddDeckModal() : ''}
                ${showRenameDeckModal ? renderRenameDeckModal() : ''}
            `;
        }

        function renderAddDeckModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-sm modal-enter shadow-2xl">
                        <h2 class="text-xl font-black text-slate-800 mb-6 uppercase">Novo Deck</h2>
                        <input id="deckNameInput" placeholder="Ex: Inglês Básico" class="w-full bg-slate-50 border-0 rounded-2xl p-4 mb-4 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        <div class="flex gap-2">
                            <button onclick="showAddDeckModal=false; render();" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold active:scale-95 transition-transform">Voltar</button>
                            <button onclick="createNewDeck()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-transform">Criar</button>
                        </div>
                    </div>
                </div>`;
        }

        function startRenameDeck(id) { renamingDeckId = id; showRenameDeckModal = true; render(); }
        
        function renderRenameDeckModal() {
            const deck = decks.find(d => String(d.id) === String(renamingDeckId));
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-sm modal-enter shadow-2xl">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-black text-slate-800 uppercase">Editar Deck</h2>
                            <button onclick="event.stopPropagation(); if(confirm('Excluir deck e todos os seus cards?')) deleteDeck(${renamingDeckId})" class="bg-rose-50 text-rose-500 p-3 rounded-2xl active:scale-90 transition-transform">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <input id="renameDeckInput" value="${deck.name}" class="w-full bg-slate-50 border-0 rounded-2xl p-4 mb-6 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <div class="flex gap-2">
                            <button onclick="showRenameDeckModal=false; render();" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">Voltar</button>
                            <button onclick="saveNewDeckName()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-md">Salvar</button>
                        </div>
                    </div>
                </div>`;
        }

        function saveNewDeckName() {
            const newName = document.getElementById('renameDeckInput').value.trim();
            if (newName) {
                const idx = decks.findIndex(d => String(d.id) === String(renamingDeckId));
                decks[idx].name = newName;
                saveDecks(); showRenameDeckModal = false; render();
            }
        }

        function renderStudyConfigModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                    <div class="bg-white rounded-[40px] p-8 w-full max-w-sm modal-enter">
                        <div class="w-10 h-10 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center mb-4">
                            <i data-lucide="settings"></i>
                        </div>
                        <h2 class="text-xl font-black text-slate-800 mb-6 uppercase">Configurações</h2>
                        <div class="space-y-6">
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest flex items-center gap-2"><i data-lucide="layers" class="w-3 h-3"></i> Prioridade de Carga</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="config.prioritizeNew=false; saveConfig(); refreshStudyQueue(); render();" class="py-3 px-2 rounded-2xl text-[10px] font-bold border transition-all ${!config.prioritizeNew ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-100 text-slate-500'}">Revisões Primeiro</button>
                                    <button onclick="config.prioritizeNew=true; saveConfig(); refreshStudyQueue(); render();" class="py-3 px-2 rounded-2xl text-[10px] font-bold border transition-all ${config.prioritizeNew ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-100 text-slate-500'}">Novos Primeiro</button>
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest flex items-center gap-2"><i data-lucide="shuffle" class="w-3 h-3"></i> Ordem dos Cards</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="config.shuffle=false; saveConfig(); refreshStudyQueue(); render();" class="py-3 px-2 rounded-2xl text-[10px] font-bold border transition-all ${!config.shuffle ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-100 text-slate-500'}">Sequencial</button>
                                    <button onclick="config.shuffle=true; saveConfig(); refreshStudyQueue(); render();" class="py-3 px-2 rounded-2xl text-[10px] font-bold border transition-all ${config.shuffle ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 border-slate-100 text-slate-500'}">Aleatória</button>
                                </div>
                            </div>
                        </div>
                        <button onclick="showStudyConfigModal=false; render();" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold mt-8 active:scale-95 transition-transform">Concluído</button>
                    </div>
                </div>
            `;
        }

        function renderStudy(root) {
            const card = studyQueue[0];
            const deck = getCurrentDeck();
            const autoFront = deck.autoFront !== undefined ? deck.autoFront : true;
            const autoBack = deck.autoBack !== undefined ? deck.autoBack : true;

            root.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <button onclick="view='home'; render();" class="text-slate-400 font-bold text-[10px] uppercase tracking-widest flex items-center gap-2 bg-white px-4 py-2 rounded-xl border border-slate-100 shadow-sm active:scale-95 transition-all">
                        <i data-lucide="arrow-left" class="w-4 h-4 text-indigo-500"></i> Home
                    </button>
                    <div class="flex gap-2">
                        <button onclick="showStudyConfigModal=true; render();" class="bg-white text-slate-600 p-2 rounded-xl border border-slate-100 shadow-sm active:scale-95 transition-all"><i data-lucide="sliders-horizontal" class="w-5 h-5"></i></button>
                        <button onclick="showManageCardsModal=true; searchTerm=''; showOnlyErrors=false; render();" class="bg-white text-slate-600 p-2 rounded-xl border border-slate-100 shadow-sm active:scale-95 transition-all"><i data-lucide="list" class="w-5 h-5"></i></button>
                        <button onclick="showAddCardModal=true; cardAddedFeedback=false; clearTempDraft(); render();" class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-100 active:scale-95 transition-all"><i data-lucide="plus" class="w-5 h-5"></i></button>
                    </div>
                </div>

                ${studyQueue.length > 0 ? `
                    <div class="flex justify-center gap-4 mb-6">
                        <button onclick="toggleAudioSetting('autoFront')" class="text-[9px] font-black uppercase px-4 py-2 rounded-full border flex items-center gap-2 transition-all ${autoFront ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg shadow-indigo-100' : 'bg-white border-slate-200 text-slate-400'}"><i data-lucide="${autoFront ? 'volume-2' : 'volume-x'}" class="w-3 h-3"></i> Auto Frente</button>
                        <button onclick="toggleAudioSetting('autoBack')" class="text-[9px] font-black uppercase px-4 py-2 rounded-full border flex items-center gap-2 transition-all ${autoBack ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg shadow-indigo-100' : 'bg-white border-slate-200 text-slate-400'}"><i data-lucide="${autoBack ? 'volume-2' : 'volume-x'}" class="w-3 h-3"></i> Auto Verso</button>
                    </div>

                    <div class="relative h-[440px] w-full perspective-1000">
                        <div class="relative w-full h-full preserve-3d ${isFlipped ? 'rotate-y-180' : ''}" onclick="handleFlipToggle()">
                            <div class="absolute inset-0 backface-hidden bg-white border border-slate-100 rounded-[40px] shadow-sm flex flex-col items-center justify-center p-8 text-center">
                                <div class="absolute top-6 right-6 flex items-center gap-1">
                                    <button onclick="event.stopPropagation(); startEditCard('${card.id}', true)" class="bg-slate-50 text-slate-300 p-3 rounded-2xl hover:text-indigo-500 transition-colors"><i data-lucide="edit-3" class="w-5 h-5"></i></button>
                                </div>
                                <span class="absolute top-8 left-1/2 -translate-x-1/2 text-[10px] font-black text-slate-300 uppercase tracking-[0.2em]">${isNewCard(card) ? 'Card Novo' : (card.interval === 0 ? 'Repetição Imediata' : 'Revisão Agendada')}</span>
                                <div class="text-2xl font-bold text-slate-800 leading-tight">
                                    ${formatCardText(card.f, false)}
                                </div>
                                ${card.type === 'cloze' && card.hint ? `
                                    <div class="mt-10">
                                        ${showHint ? `<div class="text-[11px] font-bold text-indigo-500 bg-indigo-50 px-6 py-4 rounded-3xl border border-indigo-100 flex items-center gap-2"><i data-lucide="lightbulb" class="w-4 h-4"></i> Dica: ${card.hint}</div>` : `
                                            <button onclick="event.stopPropagation(); showHint=true; render();" class="text-[10px] font-black uppercase tracking-widest text-slate-400 border border-slate-200 px-6 py-2.5 rounded-full hover:bg-slate-50 transition-colors">💡 Mostrar Dica</button>
                                        `}
                                    </div>
                                ` : ''}
                            </div>
                            <div class="absolute inset-0 backface-hidden bg-indigo-600 border border-indigo-700 rounded-[40px] shadow-2xl flex flex-col items-center justify-center p-8 text-center rotate-y-180">
                                <div class="absolute top-6 right-6 flex items-center gap-1">
                                    <button onclick="event.stopPropagation(); startEditCard('${card.id}', true)" class="bg-white/10 text-indigo-100 p-3 rounded-2xl active:scale-90 transition-transform"><i data-lucide="edit-3" class="w-5 h-5"></i></button>
                                </div>
                                <div class="text-2xl font-bold text-white mb-8">
                                    ${card.type === 'cloze' ? formatCardText(card.f, true) : formatCardText(card.b, true)}
                                </div>
                                ${card.ex ? `<div class="bg-indigo-700/40 p-5 rounded-[2rem] border border-white/10 text-left w-full shadow-inner"><p class="text-[8px] font-black text-indigo-300 uppercase mb-2 tracking-[0.1em] flex items-center gap-1.5"><i data-lucide="quote" class="w-2.5 h-2.5"></i> Exemplo</p><p class="text-sm text-white/90 italic leading-relaxed">"${formatCardText(card.ex, true)}"</p></div>` : ''}
                                <button onclick="event.stopPropagation(); triggerVersoAudio('${card.id}')" class="mt-8 text-white bg-white/20 w-14 h-14 rounded-full flex items-center justify-center active:scale-90 transition-all hover:bg-white/30 shadow-lg"><i data-lucide="volume-2" class="w-6 h-6"></i></button>
                            </div>
                        </div>
                    </div>

                    ${isFlipped ? `
                        <div class="grid grid-cols-4 gap-3 mt-8">
                            <button onclick="rate(1)" class="bg-rose-500 text-white py-5 rounded-3xl text-[10px] font-black uppercase active:scale-95 transition-all shadow-sm">Errei</button>
                            <button onclick="rate(2)" class="bg-amber-500 text-white py-5 rounded-3xl text-[10px] font-black uppercase active:scale-95 transition-all shadow-sm">Difícil</button>
                            <button onclick="rate(3)" class="bg-emerald-500 text-white py-5 rounded-3xl text-[10px] font-black uppercase active:scale-95 transition-all shadow-sm">Bom</button>
                            <button onclick="rate(4)" class="bg-sky-500 text-white py-5 rounded-3xl text-[10px] font-black uppercase active:scale-95 transition-all shadow-sm">Fácil</button>
                        </div>
                    ` : `<div class="text-center mt-10"><p class="text-slate-300 font-bold text-[10px] uppercase tracking-[0.3em] animate-pulse">Toque para responder</p></div>`}
                ` : `
                    <div class="text-center py-20 bg-white rounded-[40px] p-8 shadow-sm flex flex-col items-center">
                        <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mb-6"><i data-lucide="check-circle-2" class="w-10 h-10"></i></div>
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight">All good!</h2>
                        <button onclick="view='home'; render();" class="mt-8 bg-indigo-600 text-white px-12 py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all">Voltar ao Início</button>
                    </div>
                `}

                ${showAddCardModal ? renderAddCardModal() : ''}
                ${showManageCardsModal ? renderManageCardsModal() : ''}
                ${showEditCardModal ? renderEditCardModal() : ''}
                ${showExportModal ? renderExportModal() : ''}
                ${showStudyConfigModal ? renderStudyConfigModal() : ''}
                ${showConfirmResetModal ? renderConfirmResetModal() : ''}
                ${showPreviewModal ? renderPreviewModal() : ''}
            `;
        }

        function handleFlipToggle() {
            if (studyQueue.length === 0) return;
            isFlipped = !isFlipped;
            render();
            const deck = getCurrentDeck();
            if (isFlipped && (deck.autoBack !== undefined ? deck.autoBack : true)) triggerVersoAudio(studyQueue[0].id);
        }

        function openDeck(id) {
            currentDeckId = id; view = 'study'; isFlipped = false; showHint = false; refreshStudyQueue(); render();
            const deck = getCurrentDeck();
            if ((deck.autoFront !== undefined ? deck.autoFront : true) && studyQueue.length > 0) speak(studyQueue[0].f);
        }

        function triggerVersoAudio(cardId) {
            const card = studyQueue[0];
            if (!card || String(card.id) !== String(cardId)) return;
            speak(card.type === 'cloze' ? card.f : card.b, () => { if (card.ex) setTimeout(() => speak(card.ex), 1000); });
        }

        function rate(q) {
            const currentCard = studyQueue[0];
            const dIdx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            const cIdx = decks[dIdx].cards.findIndex(c => String(c.id) === String(currentCard.id));
            let card = decks[dIdx].cards[cIdx];
            card.wasViewed = true;

            if (q >= 3) {
                if (card.repetition === 0) card.interval = 1; 
                else if (card.repetition === 1) card.interval = 6;
                else card.interval = Math.round(card.interval * card.efactor);
                card.repetition++;
                card.efactor = Math.max(1.3, card.efactor + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
                const nextDate = getStartOfToday(); 
                nextDate.setDate(nextDate.getDate() + card.interval);
                card.dueDate = nextDate.toISOString();
                studyQueue.shift();
            } else {
                card.repetition = 0; card.interval = 0;
                if (q === 1) card.lapses = (card.lapses || 0) + 1;
                card.efactor = Math.max(1.3, card.efactor - 0.2);
                const pastDate = new Date();
                pastDate.setMinutes(pastDate.getMinutes() - 1);
                card.dueDate = pastDate.toISOString();
                studyQueue.push(studyQueue.shift());
            }

            saveDecks(); isFlipped = false; showHint = false; render();
            const deck = getCurrentDeck();
            if (studyQueue.length > 0 && (deck.autoFront !== undefined ? deck.autoFront : true)) setTimeout(() => speak(studyQueue[0].f), 450);
        }

                        <textarea id="exportTextarea" readonly onclick="this.select()" class="w-full bg-slate-50 border-0 rounded-2xl p-5 h-56 font-mono text-[10px] mb-6 outline-none shadow-inner custom-scroll">${exportText}</textarea>
                        <div class="flex flex-col gap-3"><button id="copyBtn" onclick="const t = document.getElementById('exportTextarea'); t.select(); document.execCommand('copy'); this.innerText='Copiado!'; setTimeout(()=>render(), 2000);" class="w-full bg-indigo-600 text-white py-4 rounded-3xl font-bold active:scale-95 transition-all shadow-lg shadow-indigo-100">Copiar Tudo</button><button onclick="showExportModal=false; render();" class="w-full bg-slate-100 text-slate-500 py-4 rounded-3xl font-bold">Fechar</button></div>
                    </div>
                </div>
            `;
        }

        function renderAddCardModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-6">
                    <div class="bg-white rounded-t-[40px] sm:rounded-[40px] p-8 w-full max-w-sm overflow-y-auto max-h-[95vh] modal-enter shadow-2xl">
                        <div class="flex justify-between items-center mb-8">
                            <h2 class="text-xl font-black text-slate-800 uppercase">New Card</h2>
                            <div class="flex items-center gap-3">
                                ${addMode === 'single' ? `
                                    <button onclick="openCardPreview('add')" title="Ver prévia interativa" class="bg-indigo-50 text-indigo-600 p-3 rounded-2xl active:scale-90 transition-transform">
                                        <i data-lucide="eye" class="w-5 h-5"></i>
                                    </button>
                                ` : ''}
                                <button onclick="showAddCardModal=false; clearTempDraft(); render();" class="bg-slate-50 p-2 rounded-xl text-slate-300"><i data-lucide="x" class="w-6 h-6"></i></button>
                            </div>
                        </div>
                        <div class="flex bg-slate-100 p-1.5 rounded-3xl mb-8 text-[9px] font-black uppercase tracking-widest">
                            <button onclick="addMode='single'; render();" class="flex-1 py-4 rounded-[1.25rem] transition-all ${addMode==='single'?'bg-white shadow-sm text-indigo-600':'text-slate-400'}">Individual</button>
                            <button onclick="addMode='bulk'; render();" class="flex-1 py-4 rounded-[1.25rem] transition-all ${addMode==='bulk'?'bg-white shadow-sm text-indigo-600':'text-slate-400'}">Importar</button>
                        </div>

                        ${cardAddedFeedback ? `<div class="bg-emerald-50 text-emerald-600 text-[10px] font-bold py-3 px-4 rounded-2xl mb-4 text-center animate-pulse border border-emerald-100 flex items-center justify-center gap-2"><i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Card Adicionado!</div>` : ''}

                        ${addMode === 'single' ? `
                            <div class="grid grid-cols-3 gap-2 mb-8">
                                <button onclick="cardSubtype='basic'; render();" class="text-[8px] font-black uppercase py-4 border-2 rounded-2xl transition-all ${cardSubtype==='basic'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-50 text-slate-400'}">Card 1</button>
                                <button onclick="cardSubtype='complete'; render();" class="text-[8px] font-black uppercase py-4 border-2 rounded-2xl transition-all ${cardSubtype==='complete'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-50 text-slate-400'}">Card 2</button>
                                <button onclick="cardSubtype='cloze' ; render();" class="text-[8px] font-black uppercase py-4 border-2 rounded-2xl transition-all ${cardSubtype==='cloze'?'bg-indigo-50 border-indigo-200 text-indigo-600':'border-slate-50 text-slate-400'}">Lacuna</button>
                            </div>
                            <div class="space-y-4">
                                <textarea id="newF" placeholder="${cardSubtype === 'cloze' ? 'Frase com [termo]' : 'Frente'}" class="w-full bg-slate-50 border-0 rounded-[2rem] p-6 h-24 focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition-all">${tempDraft.f}</textarea>
                                ${cardSubtype !== 'cloze' ? `<textarea id="newB" placeholder="Verso" class="w-full bg-slate-50 border-0 rounded-[2rem] p-6 h-20 focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition-all">${tempDraft.b}</textarea>` : ''}
                                ${cardSubtype === 'complete' ? `<textarea id="newEx" placeholder="Exemplo" class="w-full bg-slate-50 border-0 rounded-[2rem] p-6 h-20 focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition-all italic">${tempDraft.ex}</textarea>` : ''}
                                ${cardSubtype === 'cloze' ? `<input id="newHint" placeholder="Dica" value="${tempDraft.hint}" class="w-full bg-slate-50 border-0 rounded-[2rem] p-6 focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition-all">` : ''}
                                <button onclick="saveSingleCard()" class="w-full bg-indigo-600 text-white py-5 rounded-[2rem] font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all mt-4">Adicionar Card</button>
                            </div>
                        ` : `
                            <textarea id="bulkData" placeholder="Ex: I drink [coffee];café" class="w-full bg-slate-50 border-0 rounded-[2rem] p-6 h-64 focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-[10px] shadow-inner"></textarea>
                            <button onclick="saveBulkCards()" class="w-full bg-indigo-600 text-white py-5 rounded-[2rem] font-bold mt-6 shadow-lg shadow-indigo-100 active:scale-95 transition-all">Iniciar Importação</button>
                        `}
                    </div>
                </div>
            `;
        }

        function saveSingleCard() {
            const fInput = document.getElementById('newF');
            const f = fInput.value.trim();
            if (!f) return;
            const idx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            
            decks[idx].cards.push({ 
                id: Date.now() + Math.random(), 
                type: cardSubtype, 
                f, 
                b: cardSubtype === 'cloze' ? '' : document.getElementById('newB').value.trim(), 
                ex: cardSubtype === 'complete' ? document.getElementById('newEx').value.trim() : '', 
                hint: cardSubtype === 'cloze' ? (document.getElementById('newHint') ? document.getElementById('newHint').value.trim() : '') : '', 
                interval: 0, 
                repetition: 0, 
                efactor: 2.5, 
                lapses: 0, 
                dueDate: new Date().toISOString(), 
                wasViewed: false 
            });
            
            saveDecks();
            cardAddedFeedback = true;
            clearTempDraft();
            render();
            
            setTimeout(() => {
                const fNew = document.getElementById('newF');
                if(fNew) {
                    fNew.value = '';
                    if(document.getElementById('newB')) document.getElementById('newB').value = '';
                    if(document.getElementById('newEx')) document.getElementById('newEx').value = '';
                    if(document.getElementById('newHint')) document.getElementById('newHint').value = '';
                    fNew.focus();
                }
            }, 50);

            setTimeout(() => {
                cardAddedFeedback = false;
                if(showAddCardModal) render();
            }, 2000);
        }

        function saveBulkCards() {
            const data = document.getElementById('bulkData').value.trim();
            if(!data) return;
            const idx = decks.findIndex(d => String(d.id) === String(currentDeckId));
            data.split('\n').filter(l => l.includes(';')).forEach((line, i) => {
                const parts = line.split(';').map(s => s.trim());
                if (parts[0]) {
                    let f = parts[0], b = parts[1] || '', ex = parts[2] || '', hint = parts[3] || '';
                    let type = (f.includes('[') && f.includes(']')) ? 'cloze' : (ex ? 'complete' : 'basic');
                    if (type === 'cloze' && b && !hint) hint = b;
                    decks[idx].cards.push({ id: Date.now()+i+Math.random(), type, f, b: type==='cloze'?'':b, ex, hint, interval: 0, repetition: 0, efactor: 2.5, lapses: 0, dueDate: new Date().toISOString(), wasViewed: false });
                }
            });
            saveDecks(); showAddCardModal = false; render();
        }

        render();
    </script>
</body>
</html>
